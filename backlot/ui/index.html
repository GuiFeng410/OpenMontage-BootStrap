<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot — 项目库</title>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/library.css">
</head>
<body>
<div class="wrap">
  <header class="slate">
    <div class="clapper"></div>
    <div>
      <span class="wordmark">Backlot</span>
      <h1>项目库</h1>
    </div>
    <span class="chip" id="count"></span>
    <div class="spacer"></div>
    <span class="live idle" id="liveBadge"><span class="dot"></span><span id="liveText">空闲</span></span>
  </header>
  <section class="library-onboarding" id="onboarding" aria-labelledby="onboardingTitle"></section>
  <div class="lib-grid" id="grid"></div>
  <p class="hint" id="empty" style="display:none">暂无项目。请复制上方请求并回到聊天，让 Agent 创建商品片项目。</p>
</div>
<script type="module" src="/ui/library.js"></script>
</body>
</html>
